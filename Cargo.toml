[workspace]
members = [
    "crates/twatch-core",
    "crates/twatch-engine",
    "crates/twatch-server",
    "crates/twatchd",
]
resolver = "3"
default-members = [
    "crates/twatch-core",
    "crates/twatch-engine",
    "crates/twatch-server",
    "crates/twatchd",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
