[package]
license = "Apache-2.0"
name = "twatch-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Concrete twatch adapters: librqbit, storage, search, player"

[dependencies]
twatch-core = { path = "../twatch-core" }
anyhow = "1"
futures-util = "0.3"
async-trait = "0.1"
librqbit = { version = "8", default-features = false, features = ["rust-tls"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shaku = { version = "0.6", features = ["thread_safe"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
