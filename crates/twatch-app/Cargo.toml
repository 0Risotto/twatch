[package]
license = "Apache-2.0"
name = "twatch-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tauri desktop application for twatch"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
twatch-core = { path = "../twatch-core" }
twatch-engine = { path = "../twatch-engine" }
twatch-server = { path = "../twatch-server", features = ["embed-web"] }
anyhow = "1"
librqbit = { version = "8", default-features = false, features = ["rust-tls"] }
shaku = { version = "0.6", features = ["thread_safe"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
